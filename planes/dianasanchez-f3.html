<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fase 3 de Diana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: pila vertical de "fichas de servicio" — una cosa a la vez, pulgar en el borde. */
:root{
  --paper:#fbf9f7; --surface:#ffffff; --line:#e7e0dc;
  --ink:#231a1e; --ink-2:#6b5d62; --ink-3:#978a8e;
  --acc:#5b2740; --acc-soft:#f6ecf0; --acc-line:#e3c9d4;
  --ocre:#b8721a; --ocre-soft:#fdf3e4; --ocre-line:#eed9b4;
  --salvia:#4a7055; --salvia-soft:#eef4ef; --salvia-line:#cadcd0;
  --alerta:#a8412f; --alerta-soft:#fceee9;
  --d:'Instrument Serif',Georgia,serif;
  --b:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --m:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151013; --surface:#1e171b; --line:#352b30;
  --ink:#f3ecef; --ink-2:#b3a3aa; --ink-3:#8a7a81;
  --acc:#e9a7c0; --acc-soft:#2a1a22; --acc-line:#452c37;
  --ocre:#e8b566; --ocre-soft:#2a2016; --ocre-line:#4a3920;
  --salvia:#8fc09e; --salvia-soft:#1a241d; --salvia-line:#2f4436;
  --alerta:#f0917c; --alerta-soft:#2d1a16;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151013; --surface:#1e171b; --line:#352b30;
  --ink:#f3ecef; --ink-2:#b3a3aa; --ink-3:#8a7a81;
  --acc:#e9a7c0; --acc-soft:#2a1a22; --acc-line:#452c37;
  --ocre:#e8b566; --ocre-soft:#2a2016; --ocre-line:#4a3920;
  --salvia:#8fc09e; --salvia-soft:#1a241d; --salvia-line:#2f4436;
  --alerta:#f0917c; --alerta-soft:#2d1a16;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--b);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:30;background:var(--acc)}
.wrap{max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--ocre);outline-offset:2px;border-radius:6px}

/* ---- hero ---- */
.hero{background:var(--acc);color:#fdf7f9}
:root[data-theme="dark"] .hero,
:root:not([data-theme="light"]) .hero{background:#2a1320}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .hero{background:var(--acc)}}
.hero .wrap{padding-block:34px 26px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  color:rgba(255,255,255,.72);margin-bottom:10px}
.hero h1{font-family:var(--d);font-size:clamp(33px,8.6vw,54px);line-height:.95;letter-spacing:-.01em;color:#fff}
.hero .lede{margin-top:14px;font-size:17px;color:rgba(255,255,255,.85);max-width:34em}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:22px}
.tile{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);
  border-radius:11px;padding:11px 8px;text-align:center}
.tile b{display:block;font-family:var(--m);font-size:19px;font-weight:500;color:#fff;line-height:1.1}
.tile span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-top:5px;font-weight:600}
@media (max-width:430px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* ---- navegación pegajosa ---- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--acc);
  border-bottom:1px solid rgba(255,255,255,.14)}
.nav .scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:9px;
  max-width:720px;margin:0 auto}
.nav .scroll::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;color:rgba(255,255,255,.76);text-decoration:none;font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:99px;white-space:nowrap}
.nav a.on{background:#fff;color:var(--acc)}

/* ---- secciones ---- */
section{padding-block:30px 10px;scroll-margin-top:72px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.sec-h .n{font-family:var(--m);font-size:12px;color:var(--acc);font-weight:500}
.sec-h h2{font-family:var(--d);font-size:30px;line-height:1.05}
.sec-p{color:var(--ink-2);font-size:15px;margin:0 0 16px;max-width:36em}

/* ---- tarjeta plegable ---- */
.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin-bottom:9px;overflow:hidden}
.fold>button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;
  background:none;border:0;text-align:left}
.fold>button .ic{flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--m);font-size:13px;font-weight:500;background:var(--acc-soft);color:var(--acc)}
.fold>button .tt{flex:1;min-width:0;font-weight:600;font-size:15.5px}
.fold>button .tt small{display:block;font-weight:400;font-size:13px;color:var(--ink-3);margin-top:1px}
.fold>button .ch{flex:0 0 auto;color:var(--ink-3);transition:transform .22s}
.fold.open>button .ch{transform:rotate(180deg)}
.fold .body{padding:0 16px 16px;font-size:14.5px;color:var(--ink-2)}
.fold .body>p{margin:0 0 9px}.fold .body>p:last-child{margin-bottom:0}
.fold .body strong{color:var(--ink)}
.fold .body table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
.fold .body th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:5px 7px 5px 0;border-bottom:1px solid var(--line);font-weight:700}
.fold .body td{padding:6px 7px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.fold .body td:first-child{color:var(--ink);font-weight:500}
.scrollx{overflow-x:auto}

/* ---- timeline del día ---- */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tl-row{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);align-items:flex-start}
.tl-row:last-child{border-bottom:0}
.tl-row.key{background:var(--acc-soft)}
.tl-row .t{flex:0 0 46px;font-family:var(--m);font-size:12.5px;color:var(--ink-3);padding-top:2px}
.tl-row .c{flex:1;min-width:0}
.tl-row .c b{display:block;font-size:14.5px}
.tl-row .c span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.chk{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:0;transition:.15s}
.chk[aria-pressed="true"]{background:var(--salvia);border-color:var(--salvia)}
.chk svg{opacity:0;stroke:#fff;transition:.15s}
.chk[aria-pressed="true"] svg{opacity:1}
.tl-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:11px 15px;background:var(--salvia-soft);border-top:1px solid var(--line);font-size:13.5px}
.tl-foot button{background:none;border:0;color:var(--ink-3);font-size:12.5px;text-decoration:underline;padding:0}

/* ---- selector de días ---- */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:13px}
.days::-webkit-scrollbar{display:none}
.day-b{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:9px 13px;text-align:center;line-height:1.25}
.day-b b{display:block;font-size:13.5px;font-weight:700}
.day-b span{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--m)}
.day-b.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day-b.on span{color:rgba(255,255,255,.72)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin-bottom:9px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--acc-soft);
  border-bottom:1px solid var(--acc-line)}
.meal-h .hh{font-family:var(--m);font-size:13px;color:var(--acc);font-weight:500}
.meal-h .nn{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.meal-h .kk{font-family:var(--m);font-size:11px;color:var(--ink-2);text-align:right;line-height:1.35}
.meal ul{list-style:none;margin:0;padding:9px 15px}
.meal li{display:flex;gap:9px;padding:5px 0;font-size:14.5px;align-items:baseline}
.meal li::before{content:"";flex:0 0 5px;height:5px;border-radius:50%;background:var(--ocre);
  transform:translateY(-2px)}
.meal li em{font-style:normal;color:var(--ink-3);font-family:var(--m);font-size:12.5px}
.meal .alc{margin:0 15px 13px;padding:9px 12px;background:var(--ocre-soft);
  border:1px solid var(--ocre-line);border-radius:10px;font-size:13px;color:var(--ink-2)}
.meal .alc b{color:var(--ocre)}

/* ---- herramienta de hambre ---- */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 17px}
.q{font-family:var(--d);font-size:25px;line-height:1.14;margin-bottom:5px}
.q-sub{color:var(--ink-2);font-size:14.5px;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:11px;padding:14px 15px;font-size:15px;font-weight:500;transition:.14s}
.opt:hover{border-color:var(--acc)}
.verdict{text-align:center;padding:6px 0 2px}
.verdict .big{font-family:var(--d);font-size:30px;line-height:1.1;margin-bottom:9px}
.verdict p{color:var(--ink-2);font-size:14.5px;margin:0 auto 14px;max-width:30em}
.pill{display:inline-block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;padding:5px 11px;border-radius:99px;margin-bottom:11px}
.pill.fis{background:var(--salvia-soft);color:var(--salvia);border:1px solid var(--salvia-line)}
.pill.emo{background:var(--ocre-soft);color:var(--ocre);border:1px solid var(--ocre-line)}
.restart{background:none;border:1px solid var(--line);border-radius:99px;padding:8px 17px;
  font-size:13.5px;color:var(--ink-2)}
.steps{display:flex;gap:5px;justify-content:center;margin-bottom:17px}
.steps i{width:22px;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--acc)}

/* ---- azúcar de la fruta ---- */
.sugar{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:1fr 2.1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-track{height:21px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--salvia);width:0;transition:width .85s cubic-bezier(.2,.7,.3,1)}
.bar-row.bad .bar-fill{background:var(--alerta)}
.bar-row .g{font-family:var(--m);font-size:13px;color:var(--ink-2);min-width:44px;text-align:right}

/* ---- semáforo ---- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;
  padding:7px 14px;font-size:13.5px;font-weight:600}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;margin-bottom:11px}
.foods{display:flex;flex-wrap:wrap;gap:6px}
.food{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:13.5px;background:var(--surface)}
.food i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.food.v i{background:var(--salvia)} .food.a i{background:var(--ocre)} .food.r i{background:var(--alerta)}
.food small{color:var(--ink-3);font-family:var(--m);font-size:11.5px}
.empty{color:var(--ink-3);font-size:14px;padding:14px 0}

/* ---- notas ---- */
.note{border-left:3px solid var(--ocre);background:var(--ocre-soft);border-radius:0 11px 11px 0;
  padding:13px 15px;font-size:14px;color:var(--ink-2);margin-top:13px}
.note b{color:var(--ink)}
.note.alert{border-color:var(--alerta);background:var(--alerta-soft)}
.note.ok{border-color:var(--salvia);background:var(--salvia-soft)}

/* ---- medir ---- */
.tests{display:grid;gap:8px}
.test{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px}
.test .nm{flex:0 0 26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-family:var(--m);font-size:12px}
.test .tx{flex:1;min-width:0;font-size:14.5px}
.test input{width:62px;padding:7px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);font-family:var(--m);font-size:14px;text-align:center}

.cierre{margin-top:18px}
.cierre .note{font-size:14.5px}
footer{border-top:1px solid var(--line);margin-top:34px}
footer .wrap{padding-block:22px 30px;text-align:center;color:var(--ink-3);font-size:12.5px}
footer b{color:var(--ink-2);display:block;font-size:13.5px;margin-bottom:3px}
/* ---- suplementos ---- */
.fold>button .ic.h{flex:0 0 50px;font-size:11.5px;letter-spacing:-.02em;
  background:var(--ocre-soft);color:var(--ocre)}
.st{flex:0 0 auto;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:4px 9px;border-radius:99px;white-space:nowrap}
.st.sigue{background:var(--salvia-soft);color:var(--salvia);border:1px solid var(--salvia-line)}
.st.nuevo{background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.st.para{background:var(--alerta-soft);color:var(--alerta);border:1px solid var(--alerta-soft)}
.st.opc{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
@media (max-width:440px){.fold>button .st{font-size:8.5px;padding:3px 6px;letter-spacing:.04em}
  .fold>button .tt{font-size:14.5px}}
.flag{display:inline-block;font-family:var(--m);font-size:10.5px;padding:2px 7px;border-radius:5px;
  margin-right:5px;vertical-align:1px}
.flag.ok{background:var(--salvia-soft);color:var(--salvia)}
.flag.chk{background:var(--ocre-soft);color:var(--ocre)}

/* ---- tabla de suplementos ---- */
.sub-h{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin:20px 0 8px}
.tabla{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:11px}
.tabla .tr{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
.tabla .tr:last-child{border-bottom:0}
.tabla .h{flex:0 0 52px;font-size:11px;color:var(--acc);line-height:1.25}
.tabla .nm3{flex:1;min-width:0;font-size:14px;line-height:1.3}
.tabla .nm3 small{display:block;color:var(--ink-3);font-size:11.5px}
.tabla .ds{flex:0 0 auto;font-size:11.5px;color:var(--ink-2);text-align:right}
.tabla .st{flex:0 0 auto}
@media (max-width:430px){.tabla .ds{display:none}}

/* ---- intercambios ---- */
.bud{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:13px}
@media (max-width:560px){.bud{grid-template-columns:repeat(3,1fr)}}
.bud div{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:10px 5px;text-align:center}
.bud b{display:block;font-family:var(--m);font-size:19px;font-weight:500;line-height:1.1;color:var(--acc)}
.bud span{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-top:4px;font-weight:600}
.sw-head{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:12px;
  padding:12px 15px;margin-bottom:9px;font-size:14px;color:var(--ink-2)}
.sw-head b{color:var(--acc)}
.sw-list{display:grid;gap:6px}
.sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;transition:.14s}
.sw:hover{border-color:var(--acc)}
.sw.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sw .nm2{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.sw .pr{font-family:var(--m);font-size:12.5px;color:var(--ink-3);text-align:right}
.sw.on .pr{color:rgba(255,255,255,.76)}

/* ---- mercado ---- */
.mk-grp{margin-bottom:14px}
.mk-grp h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:7px;font-weight:700}
.mk-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mk{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:11px 14px}
.mk:last-child{border-bottom:0}
.mk .nm2{flex:1;min-width:0;font-size:14.5px}
.mk .qt{font-family:var(--m);font-size:12.5px;color:var(--ink-3);text-align:right}
.mk.got .nm2,.mk.got .qt{text-decoration:line-through;color:var(--ink-3);opacity:.6}
.mk-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--salvia-soft);border:1px solid var(--salvia-line);border-radius:12px;
  padding:11px 15px;margin-bottom:13px;font-size:13.5px}
.mk-bar button{background:none;border:0;color:var(--ink-3);font-size:12.5px;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- acento por fase ---- */
:root[data-fase="2"]{--acc:#1d4f61;--acc-soft:#e8f0f3;--acc-line:#c2d8e0}
:root[data-fase="3"]{--acc:#8a4420;--acc-soft:#fbeee6;--acc-line:#eccfb9}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-fase="2"]{--acc:#8fc8dd;--acc-soft:#15242b;--acc-line:#274049}
  :root:not([data-theme="light"])[data-fase="3"]{--acc:#efab76;--acc-soft:#2a1b12;--acc-line:#4a3122}}
:root[data-theme="dark"][data-fase="2"]{--acc:#8fc8dd;--acc-soft:#15242b;--acc-line:#274049}
:root[data-theme="dark"][data-fase="3"]{--acc:#efab76;--acc-soft:#2a1b12;--acc-line:#4a3122}

/* ---- cita textual de la alumna ---- */
.cita{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-left:3px solid rgba(255,255,255,.55);border-radius:0 13px 13px 0;
  padding:15px 17px;margin-top:20px}
.cita q{font-family:var(--d);font-size:clamp(19px,5vw,23px);line-height:1.25;color:#fff;
  display:block;quotes:'\201C' '\201D'}
.cita cite{display:block;font-style:normal;font-size:12px;color:rgba(255,255,255,.62);margin-top:9px;
  letter-spacing:.03em}
/* ---- mensaje personal ---- */
.carta{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:19px 18px;position:relative;margin-bottom:13px}
.carta::before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:3px;
  background:var(--acc);border-radius:0 3px 3px 0}
.carta p{font-size:15.5px;line-height:1.62;color:var(--ink-2);margin:0 0 13px}
.carta p:first-child{font-size:16.5px;color:var(--ink)}

reglaCambio: '<b>La única regla del cambio:</b> cambia <b>dentro</b> del mismo grupo, nunca <b>entre</b> grupos. El almidón son 4 porciones en día alto (lunes, miércoles, viernes y sábado) y 3 en día moderado (martes, jueves y domingo). <b>Una de esas porciones es siempre la de la cena</b>, los siete días, incluso los moderados.',
estirar: ['Cómo estirar la semana','Tres rotaciones, sin cuentas',
  ['<b>Rota la proteína.</b> Cocina pollo, pavo y pescado en lote el domingo y el miércoles. Dos días cada uno. La res y el camarón son los días que quieras cocinar fresco.',
   '<b>Rota el sabor, no el plato.</b> El mismo pollo cambia por completo con epazote, con comino y pimentón, o con chile dulce asado y limón. Sin cebolla ni ajo, el sabor lo pones con hierba y con chile.',
   '<b>Rota la fruta del postre.</b> Fresa, frambuesa, papaya y piña. El cacao y la chía no cambian: son el motor del postre.']],

mercadoFolds: [
 ['El día de cocinar','Domingo por la tarde, 90 minutos',[
  '<b>1.</b> Pon a cocer el arroz y la papa primero. En cuanto enfríen, al refri <b>12 horas</b>: ahí se forma el almidón resistente que alimenta tu microbiota y baja el pico de glucosa. Recalientas sin perder el efecto.',
  '<b>2.</b> Pollo y pavo a la plancha, porcionados en bolsas de una palma. Dos días en refri, el resto al congelador.',
  '<b>3.</b> Nopal, chayote, calabacita y kale asados en lote, en frasco de vidrio. Aguantan 4 días.',
  '<b>4.</b> Base de postre en frasco: cacao, monk fruit y chía mezclados en seco. Fruta roja lavada aparte. El postre se arma en 2 minutos.',
  '<b>5.</b> Salsa tatemada sin cebolla: jitomate y chile dulce asados con cilantro y limón. Levanta cualquier plato de la semana.']],
 ['Dónde comprar','Ciudad de México',[
  '<b>Mercado o tianguis:</b> nopal, chayote, verdura y fruta. Más barato y mejor que el súper, y es donde encuentras el nopal de verdad.',
  '<b>Supermercado:</b> proteína, huevo, atún, arroz y despensa.',
  '<b>Cuidado con las etiquetas:</b> el consomé en polvo, los sazonadores y los caldos de caja llevan cebolla y ajo deshidratados. Son la fuente escondida que te sigue inflando sin que lo notes. Caldo de huesos casero o agua con epazote y laurel.']]
],

educacion: [
 ['Tu cintura de hoy es tu primera medición real','El número que te desanimó no era comparable',[
  '<b>En el informe de la Fase 2 tu cintura figura en 75 cm. Hoy la Seca marca 95 cm.</b>',
  'Una diferencia de 20 cm en cinco semanas no existe en fisiología: tu peso solo cambió 1 kg. Lo que pasó es que esas dos cifras no se midieron en el mismo sitio.',
  'Por eso la meta de «70 a 72 cm» que llevabas en la cabeza nunca fue alcanzable: estaba construida sobre un dato que no era el mismo. <b>No fallaste tú; falló la referencia.</b>',
  'La medición de hoy, a la altura del ombligo, es tu línea de salida real. Y a partir de aquí sí es comparable semana a semana.']],
 ['El fin de semana es la cuenta que falta','Y ya pasó dos veces',[
  'En la Fase 1 corriste déficit de lunes a viernes y el fin de semana devolvió casi lo mismo. <b>La suma dio cerca de cero.</b>',
  'En la Fase 2 volvió a pasar, y esta vez la suma quedó ligeramente arriba. Tú misma lo escribiste: <b>«me cuidé los fines de semana pero no lo hice al pie»</b>, y marcaste que la semana en que más se cayó el plan fue «en findes».',
  '<b>No es falta de disciplina.</b> Es lo que le pasa a un cuerpo que come por debajo de lo que gasta cinco días seguidos: el sexto día la biología cobra.',
  'Por eso esta fase come igual los siete días y el sábado ya trae su comida fuera adentro. Cuando no hay restricción de lunes a viernes, no hay desborde el sábado.']],
 ['No hay déficit, y por eso va a funcionar','La parte más difícil de creer',[
  '<b>Llevas nueve semanas seguidas de plan en déficit, sin una sola recarga y sin una pausa.</b>',
  'Lo que eso produce está documentado y tú lo estás sintiendo todo: frío nuevo, manos y pies fríos, antojos de dulce a diario en 8 de 10, energía en 2 de 10 a final de la tarde, y el ciclo que se movió.',
  'Un cuerpo en ese estado baja el gasto sin avisar, retiene agua y defiende la grasa. Bajarle más la comida en este punto es lo único que garantiza que no pase nada.',
  '<b>Comer en mantenimiento, con proteína alta y fuerza, es la vía para cambiar la composición en una mujer que viene de donde tú vienes.</b> Se gana tejido magro con la energía cubierta, y eso cambia cómo te queda la ropa aunque la báscula no se mueva.']],
 ['A los 47, tu cuerpo cambió de reglas','Y esto no estaba en la ecuación',[
  'Tus laboratorios del 28 de octubre muestran <b>FSH en 12,3 con estradiol en 29,9 y progesterona en 0,48</b>. Tu ciclo se acortó durante esta fase y hoy llevas más de un mes sin menstruar.',
  'Eso es una <b>transición perimenopáusica</b>. Ya lo veníamos vigilando desde la Fase 2 y hoy se confirma. No es un diagnóstico grave: es información que cambia el diseño.',
  'En esta etapa la grasa se redistribuye hacia el abdomen, la masa magra se pierde más rápido y el déficit agresivo se tolera peor. <b>La proteína y las pesas no son menos importantes ahora: son más.</b>',
  'Te voy a pedir cita con ginecología. No para alarmarnos, sino para que lo que sigue lo diseñemos con el dato completo.']],
 ['La hinchazón no es grasa, y tiene nombre','10 de 10 tiene una explicación concreta',[
  '<b>Tu puntaje digestivo pasó de 48 % al inicio del programa a 73 % hoy.</b> Hinchazón, gases y dolor a diario.',
  'No es un misterio: durante la Fase 2 entraron todos los días lenteja, frijol, hummus de garbanzo, avena, leche de avena y la proteína Habits. Con tu SII diagnosticado, esa carga fermentable junta es mucha.',
  'Por eso estas dos semanas salen esos cinco grupos. No es volver al FODMAP estricto: es un retiro dirigido, con fecha de salida.',
  '<b>Desde la semana 3 los reintroducimos de uno en uno, cada tres días</b>, para saber exactamente cuál es el tuyo. Al final de la fase vas a tener tu mapa, no una lista de prohibiciones.']],
 ['El dulce de la noche es parte del plan','No es un permiso: es el mecanismo',[
  'Escribiste: <b>«en la noche me quedo con hambre o ganas de algo dulce»</b>. Esa frase no describe un antojo: describe una cena a la que le falta almidón.',
  'El carbohidrato de la noche sube serotonina, sostiene el sueño profundo y baja el cortisol de la madrugada. <b>Quitarlo es lo que fabrica el antojo que luego intentas resistir.</b>',
  'Por eso los siete días, también los moderados, tu cena lleva su ½ taza de almidón, y las 17:30 llevan tu postre de cacao.',
  '@azucar']]
],
azucar: [['1 taza de fresas',7],['¾ taza de papaya',8],['1 cucharada de azúcar',12],['1 refresco de 355 mL',39,1]],
notaEduca: 'La verdad incómoda de esta fase: <b>es muy posible que la báscula no se mueva en estos 34 días, y aun así sea la fase que más te cambia el cuerpo.</b> Lo que sí espero que cambie es la hinchazón, la energía de la tarde, los antojos y lo que levantas en el gimnasio. Esos cuatro son los que miden si esto funcionó.',

protocolos: [
 ['Tu entrenamiento, semana a semana','3 sesiones de fuerza · 45–60 min · RPE 7–8',[
  '<b>Tu hombro y tu codo izquierdos siguen adaptados:</b> nada de press ni carga por encima de la cabeza de ese lado. Máquinas, agarre neutro y trabajo unilateral empezando por el derecho. Sigue pendiente la cita de fisioterapia.',
  '<b>RPE 7–8 quiere decir que terminas la serie con 2 o 3 repeticiones en el tanque.</b> No al fallo. Esa es la intensidad que retiene y construye músculo sin romper la recuperación.',
  '<div class="scrollx"><table><tr><th>Sesión A · lunes</th><th>Series × reps</th><th>RPE</th></tr>'+
  '<tr><td>Sentadilla goblet o prensa 45°</td><td>3 × 8–10</td><td>7–8</td></tr>'+
  '<tr><td>Peso muerto rumano con mancuernas</td><td>3 × 8–10</td><td>7</td></tr>'+
  '<tr><td>Remo en máquina con apoyo de pecho</td><td>3 × 10–12</td><td>7–8</td></tr>'+
  '<tr><td>Press de pecho en máquina, agarre neutro</td><td>3 × 10–12</td><td>7</td></tr>'+
  '<tr><td>Puente de glúteo con barra</td><td>3 × 12</td><td>7</td></tr>'+
  '<tr><td>Pallof press + dead bug</td><td>2 × 10 por lado</td><td>—</td></tr></table></div>',
  '<div class="scrollx"><table><tr><th>Sesión B · miércoles</th><th>Series × reps</th><th>RPE</th></tr>'+
  '<tr><td>Hip thrust</td><td>3 × 8–10</td><td>8</td></tr>'+
  '<tr><td>Zancada o step-up</td><td>3 × 10 por pierna</td><td>7</td></tr>'+
  '<tr><td>Jalón al pecho, agarre neutro</td><td>3 × 10–12</td><td>7–8</td></tr>'+
  '<tr><td>Remo con mancuerna a una mano, derecho primero</td><td>3 × 10 por lado</td><td>7</td></tr>'+
  '<tr><td>Curl femoral en máquina</td><td>3 × 12</td><td>7</td></tr>'+
  '<tr><td>Plancha con apoyo</td><td>3 × 30–40 s</td><td>—</td></tr></table></div>',
  '<div class="scrollx"><table><tr><th>Sesión C · viernes</th><th>Series × reps</th><th>RPE</th></tr>'+
  '<tr><td>Prensa 45°</td><td>3 × 10–12</td><td>8</td></tr>'+
  '<tr><td>Bisagra de cadera con mancuernas</td><td>3 × 8</td><td>7</td></tr>'+
  '<tr><td>Remo sentado en polea, agarre neutro</td><td>3 × 12</td><td>7–8</td></tr>'+
  '<tr><td>Aperturas o press en máquina</td><td>3 × 12</td><td>7</td></tr>'+
  '<tr><td>Extensión de cadera en polea</td><td>3 × 12</td><td>7</td></tr>'+
  '<tr><td>Gemelo de pie + core</td><td>3 × 15</td><td>—</td></tr></table></div>',
  '<b>Cómo eliges el peso de arranque:</b> no tengo tus cargas por escrito, así que arrancas por sensación. Elige el peso con el que llegues al <b>extremo alto</b> del rango de repeticiones dejando 2 o 3 en el tanque. Anótalo. Ese es tu punto de partida.',
  '<b>Cómo progresas (doble progresión):</b> cuando logres el extremo alto del rango en las tres series, con RPE 8 o menos, en <b>dos sesiones seguidas</b>, subes el peso entre 2,5 % y 5 %. Y vuelves a empezar por el extremo bajo.',
  '<b>Sábado opcional:</b> 25–30 min de glúteo, core y movilidad de hombro a RPE 6. Si llegas cansada, no va. Nunca es obligatoria.',
  '<b>Zona 2 martes y jueves:</b> 25–30 min caminando rápido, bici o elíptica, a un ritmo en el que puedas hablar en frases completas.',
  '<b>Pasos:</b> 8.000 a 10.000 al día, más 10–15 min de caminata después de la comida principal y después de la cena.']],
 ['Tu tabla de registro','Esto es un dato clínico, no un detalle',[
  'Es la única planilla que te pido en toda la fase, y es la que más me sirve. Una línea por ejercicio, por semana.',
  '<div class="scrollx"><table><tr><th>Ejercicio</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th></tr>'+
  '<tr><td>Sentadilla / prensa</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr>'+
  '<tr><td>Peso muerto rumano</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr>'+
  '<tr><td>Hip thrust</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr>'+
  '<tr><td>Remo con apoyo</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr>'+
  '<tr><td>Jalón al pecho</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr>'+
  '<tr><td>Press en máquina</td><td>___</td><td>___</td><td>___</td><td>___</td><td>___</td></tr></table></div>',
  'Anota <b>peso × repeticiones × RPE</b>. Foto de la hoja cada viernes. Si una carga baja dos semanas seguidas, eso me dice algo que ningún otro dato me dice.']],
 ['Por qué no hay HIIT en esta fase','Y qué tiene que pasar para que entre',[
  'El HIIT es parte de la Fase 3, pero sobre un sistema con reservas. Sobre uno que viene de nueve semanas de déficit, con energía de la tarde en 2 de 10, el ciclo movido y antojos en 8 de 10, <b>agrega estrés sin agregar resultado</b>.',
  '<b>Entra cuando se cumplan los cuatro, no antes:</b>',
  '· Tu energía de la tarde en 5 de 10 o más, sostenida dos semanas.<br>· Menstruación presente.<br>· Sin episodios de comer sin poder parar.<br>· Ferritina y tiroides confirmadas por laboratorio.',
  'Lo revisamos el Día 80 y otra vez el Día 100. Si se cumplen antes, entra antes. Mientras tanto, la intensidad la pones en la barra, no en el cardio.']],
 ['Sauna','Desde la semana 3, y con una condición',[
  'El calor es un estresor útil <b>sobre un cuerpo con reservas</b> y perjudicial sobre uno sin ellas. Por eso no entra las dos primeras semanas.',
  '<b>Desde el 16 de noviembre, si y solo si</b> tu energía de la tarde subió a 5 de 10 o más y no te mareas al pararte: 2 o 3 veces por semana, 15–20 min, 80–90 °C.',
  'Agrega 500 mL de agua con electrolitos ese día.',
  '<b>La semana del desierto, no.</b> Ya vas a tener suficiente calor.']],
 ['La semana del desierto','Me faltan las fechas: mándamelas',[
  'No sé en qué semana cae tu viaje, así que te dejo el protocolo para que lo pegues encima de la semana que toque.',
  '<b>Lo que no se negocia:</b> las cinco tomas con proteína y el almidón de la cena. Eso sostiene la fase sola.',
  '<b>Lleva:</b> tu proteína en polvo en porciones individuales, atún en lata, nuez pecana, mandarina y tu cacao con chía en frasco.',
  '<b>Hidratación:</b> en desierto súbele a 3 litros con electrolitos. La deshidratación te va a dar más hambre y más antojo de dulce, y lo vas a leer como ansiedad.',
  '<b>Entrenamiento:</b> dos sesiones de cuerpo completo con bandas o peso corporal, 25 min, a RPE 7. Sentadilla, bisagra con banda, remo con banda, plancha, puente de glúteo. Eso mantiene el estímulo.',
  '<b>Nada de sauna</b> esa semana, y <b>nada de ayunar</b> al volver.']],
 ['Tu sueño ya está bien: lo que falta es la hora','Duermes 8–9 h y despiertas en 10 de 10',[
  'Este es tu punto más fuerte y no lo vamos a tocar. <b>No necesitas dormir más.</b>',
  'Lo que sí te pido es <b>consistencia</b>: misma hora de acostarte y de levantarte los siete días, con margen de media hora. También sábado y domingo.',
  'Luz natural 10 min al despertar, antes del celular.',
  'Último café a la 1:00 pm, máximo dos tazas, y nunca en ayunas por tu gastritis.',
  'Pantallas fuera 60 min antes de dormir, con tu glicina.']],
 ['Tu plan digestivo','Lo que más te importa: desinflarte',[
  '<b>Catorce días de retiro dirigido.</b> Salen: todos los lácteos (ya confirmado), avena y leche de avena, proteína Habits, y leguminosas (lenteja, frijol, garbanzo, hummus). Cebolla y ajo salen para siempre, como pediste.',
  '<b>No subimos fibra fermentable ni agregamos probióticos</b> mientras la hinchazón crezca a lo largo del día. Eso incluye inulina, FOS y achicoria escondidas en etiquetas de barritas y proteínas.',
  '<b>Reintroducción desde el 16 de noviembre:</b> un grupo cada 3 días, con dosis creciente, anotando síntomas de 0 a 10. Orden: lenteja → frijol → avena → leche de avena. Si uno da 4 o más, se queda fuera y seguimos con el siguiente.',
  '<b>Caminata de 10–15 min después de comer.</b> Es gratis y es de lo que más te va a mover la digestión.',
  '<b>Por tu reflujo:</b> cena 3 horas antes de dormir y nunca café en ayunas.',
  '<b>Pregunta que necesito que me contestes esta semana:</b> ¿tu hinchazón empieza leve en la mañana y va creciendo hasta ser máxima en la noche, o aparece de golpe después de un alimento concreto? La respuesta cambia el plan.']],
 ['Qué medimos y cuándo','Y qué no vamos a medir',[
  '<div class="scrollx"><table><tr><th>Fecha</th><th>Qué</th></tr>'+
  '<tr><td>Esta semana</td><td>Laboratorios que te mando aparte</td></tr>'+
  '<tr><td>Vie 13 nov · Día 80</td><td>Cintura, cargas, energía de la tarde, hinchazón, Bristol</td></tr>'+

  } else {
    const fis=pts<=1;
    t.innerHTML=`<div class="verdict">
      <span class="pill ${fis?'fis':'emo'}">${fis?'Hambre física':'Probablemente emocional'}</span>
      <div class="big">${fis?'Come.':'Dale 20 minutos.'}</div>
      <p>${fis?'Tu cuerpo está pidiendo comida de verdad. Si ya hiciste tu toma, sube verdura libre y cuéntamelo en la próxima cita.'
             :'Pon un temporizador y haz algo con las manos. El hambre física espera; esta casi siempre se va. <strong>Y si a los 20 minutos sigue ahí, cómetelo</strong>: sentada, en plato, sin pantalla. No es una falla. Es información.'}</p>
      <button class="restart">Volver a empezar</button></div>`;
    $('.restart',t).addEventListener('click',()=>{paso=0;pts=0;drawTool()});
  }
}
drawTool();

/* ---------- azúcar ---------- */
function drawSugar(el){
  if(!el||el.dataset.d) return; el.dataset.d=1;
  const max=Math.max(...A.azucar.map(s=>s[1]));
  el.innerHTML=A.azucar.map(s=>`<div class="bar-row${s[2]?' bad':''}">
    <span>${s[0]}</span><span class="bar-track"><span class="bar-fill" data-w="${s[1]/max*100}"></span></span>
    <span class="g">${s[1]} g</span></div>`).join('');
  requestAnimationFrame(()=>setTimeout(()=>
    $$('.bar-fill',el).forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',i*110)),60));
}

/* ---------- semáforo ---------- */
let filt='t';
function drawFoods(){
  const q=$('#q').value.trim().toLowerCase();
  const l=A.semaforo.filter(f=>(filt==='t'||f[1]===filt)&&(!q||f[0].toLowerCase().includes(q)));
  $('#foods').innerHTML = l.length
    ? l.map(f=>`<span class="food ${f[1]}"><i></i>${f[0]}${f[2]?` <small>${f[2]}</small>`:''}</span>`).join('')
    : `<p class="empty">No tengo ese en la lista. Pregúntamelo en la próxima cita y lo ubicamos.</p>`;
}
$('#filters').innerHTML=[['t','Todos'],...Object.entries(A.etiquetas)]
  .map(([k,l])=>`<button class="fchip${k==='t'?' on':''}" data-k="${k}">${l}</button>`).join('');
$$('#filters .fchip').forEach(b=>b.addEventListener('click',()=>{
  filt=b.dataset.k; $$('#filters .fchip').forEach(x=>x.classList.toggle('on',x===b)); drawFoods();}));
$('#q').addEventListener('input',drawFoods);
drawFoods();

/* ---------- nav activa ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}),
  {rootMargin:'-20% 0px -70% 0px'});
$$('section').forEach(s=>io.observe(s));

</script>
</body>
</html>
